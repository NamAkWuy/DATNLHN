version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: attendance_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=attendance_db
      - LANG=C.UTF-8
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: attendance_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - attendance_data:/app/uploads
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@db:3306/attendance_db?charset=utf8mb4
      - SECRET_KEY=change-this-secret-key-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_HOURS=8
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: attendance_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    working_dir: /app
    command: npm run dev -- --host
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  attendance_data:
  mysql_data:
